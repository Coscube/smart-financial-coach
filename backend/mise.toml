[tools]
python = "3.11"
poetry = "latest"

[env]
VIRTUAL_ENV = "{{config_root}}/.venv"

[tasks.install]
description = "Install dependencies with Poetry"
run = "poetry install"

[tasks.dev]
description = "Run development server"
run = "poetry run uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"

[tasks.test]
description = "Run tests"
run = "poetry run pytest"

[tasks.test-cov]
description = "Run tests with coverage"
run = "poetry run pytest --cov=src --cov-report=html"

[tasks.lint]
description = "Run linter"
run = "poetry run flake8 src tests"

[tasks.format]
description = "Format code"
run = "poetry run black src tests && poetry run isort src tests"

[tasks.format-check]
description = "Check code formatting"
run = "poetry run black --check src tests && poetry run isort --check src tests"
